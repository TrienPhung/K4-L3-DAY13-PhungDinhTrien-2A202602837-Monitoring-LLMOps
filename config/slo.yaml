service: day13-l3b-monitoring-llmops-lab
primary_slo:
  name: fast_successful_requests
  window: 28d
  sli:
    good_event: 'event == "response_sent" and latency_ms <= 3000'
    total_event: 'event == "request_received"'
  target_percent: 99.5
  error_budget_percent: 0.5
  note: >-
    Giữ mục tiêu 99.5% và ngưỡng 3000 ms vì baseline của tôi đạt được: không có request lỗi,
    request thường mất 400-600 ms, chậm nhất khoảng 2.7 s (request khởi động), tức mọi request
    trong dữ liệu đo đều nằm trong ngưỡng, và một sự cố retrieval chậm (+2.5 s) sẽ đẩy latency
    sát hoặc vượt ngưỡng. Error budget 0.5% trong 28 ngày: nếu có 10,000 request thì tối đa
    50 request được phép lỗi hoặc chậm hơn 3000 ms. Alert latency đặt sớm hơn ở 2000 ms để
    cảnh báo trước khi budget bị tiêu hao.
guardrails:
  error_rate_pct_max: 2
  daily_cost_usd_max: 2.5
  quality_score_avg_min: 0.75
  retrieval_success_rate_pct_min: 90