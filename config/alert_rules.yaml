alerts:
  - name: HighLatencyP95
    severity: warning
    condition: "p95(latency_ms) > 2000"
    duration: 5m
    type: symptom-based
    channel: slack
    owner: student-2A202602837
    runbook: docs/alerts.md#alert-1
  - name: HighErrorRate
    severity: critical
    condition: "error_rate_pct > 2 or retrieval_success_rate_pct < 90"
    duration: 5m
    type: symptom-based
    channel: slack
    owner: student-2A202602837
    runbook: docs/alerts.md#alert-2
  - name: HighCostPerRequest
    severity: warning
    condition: "avg(cost_usd) > 0.005"
    duration: 5m
    type: symptom-based
    channel: slack
    owner: student-2A202602837
    runbook: docs/alerts.md#alert-3